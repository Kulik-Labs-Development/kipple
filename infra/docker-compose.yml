# Kipple — single-host production stack (Docker Compose / Portainer).
#
# Deploys with the docker compose CLI and as a Portainer stack (CE and BE):
#   Portainer -> Stacks -> Add stack -> Web editor / Upload / Git repository
#
# Portainer compatibility notes:
# - No bind mounts: relative-path mounts are a Business Edition feature and
#   break CE uploads, so the Caddyfile is inlined in the CADDYFILE env var.
# - Profiles activate via the COMPOSE_PROFILES stack env var (Portainer) or
#   --profile (CLI). Set one value or * — comma lists are a known Portainer
#   bug (portainer/portainer#13033).
# - No healthcheck.start_interval (not supported by Portainer's deployer).
# - depends_on conditions (service_healthy) are supported by Portainer local
#   stacks, so startup ordering works the same as with the CLI.
#
# Env vars (Portainer: the "Environment variables" step, or upload a .env):
#   AUTH_SECRET        required — openssl rand -base64 32
#   PUBLIC_URL         e.g. https://help.example.com (no trailing slash)
#   KIPPLE_TAG         image tag (default: latest — pin vX.Y.Z in production)
#   TRUST_PROXY        true when a reverse proxy sets X-Forwarded-* (Mode B: true)
#   COMPOSE_PROFILES   proxy = bundled Caddy with auto-HTTPS; dev = mailpit+adminer

name: kipple

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kipple}
      POSTGRES_USER: ${POSTGRES_USER:-kipple}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kipple}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/kulik-labs-development/kipple/api:${KIPPLE_TAG:-latest}
    restart: unless-stopped
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required (openssl rand -base64 32)}
      DATABASE_URL: ${DATABASE_URL:-postgres://kipple:kipple@db:5432/kipple}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    image: ghcr.io/kulik-labs-development/kipple/worker:${KIPPLE_TAG:-latest}
    restart: unless-stopped
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DATABASE_URL: ${DATABASE_URL:-postgres://kipple:kipple@db:5432/kipple}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Process liveness only: the worker has no HTTP endpoint yet. Replace with
    # a real health check when the email pipeline adds one.
    healthcheck:
      test: ["CMD-SHELL", "ps -o comm= -p 1 | grep -q node"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Mode B — bundled reverse proxy with automatic HTTPS. Enable with
  # `--profile proxy` (CLI) or COMPOSE_PROFILES=proxy (Portainer stack env var)
  # and set TRUST_PROXY=true. To serve a real domain, edit the CADDYFILE value
  # below (e.g. replace :80 with help.example.com) and point DNS at this host.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["proxy"]
    entrypoint: ["sh", "-c", "printf '%s' \"$CADDYFILE\" > /etc/caddy/Caddyfile && exec caddy run"]
    environment:
      CADDYFILE: |
        :80 {
          reverse_proxy api:3000
        }
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy

  # Dev helpers (local email capture + DB browser). Enable with
  # `--profile dev` (CLI) or COMPOSE_PROFILES=dev (Portainer).
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    profiles: ["dev"]
    environment:
      MP_SMTP_AUTH: any

  adminer:
    image: adminer:4
    restart: unless-stopped
    profiles: ["dev"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  caddy-data:
  caddy-config:
